<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听舒｜Tingshu</title>
    <link rel="icon" href="assets/favicon-tin.ico" type="image/x-icon">
    <style>
      body {
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          box-sizing: border-box;
          padding: 12px;
          background-color: #e9ecef;
          margin: 0;
      }
      .player-container {
          background-color: #ffffff;
          padding: 30px;
          box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.15);
          border-radius: 12px;
          box-sizing: border-box;
          width: min(440px, 100%);
          text-align: center;
      }
      .button-container {
          display: flex;
          justify-content: space-between;
          gap: 10px; /* 设置按钮之间的间距 */
          margin-top: 10px;
      }
      h1 {
          color: #333;
          margin-top: 0;
          font-size: 24px;
          letter-spacing: 1px;
      }
      .now-playing {
          font-size: 14px;
          color: #595959;
          margin: 10px 0;
      }
      audio {
          width: 100%;
          margin: 15px 0;
          border-radius: 8px;
          background-color: #f8f9fa;
      }
      button {
          padding: 10px 18px;
          margin: 5px;
          font-size: 16px;
          cursor: pointer;
          border: none;
          border-radius: 5px;
          background-color: #0858a8;
          color: white;
          transition: background-color 0.3s, transform 0.2s;
          display: flex;
          align-items: center;
          gap: 8px;
      }
      button:enabled:hover {
          background-color: #064485;
      }
      button:disabled {
          cursor: default;
          opacity: .55;
      }
      :focus-visible {
          outline: 3px solid #1359a6;
          outline-offset: 3px;
      }
      .playlist {
          list-style: none;
          margin: 20px 0 0;
          max-height: 500px;
          overflow-y: auto;
          border: 1px solid #ddd;
          border-radius: 5px;
          background-color: #f8f9fa;
          padding: 6px;
      }
      button.playlist-item {
          width: 100%;
          margin: 0;
          padding: 10px;
          border-bottom: 1px solid #e5e7eb;
          text-align: left;
          background-color: transparent;
          color: #333;
      }
      button.playlist-item:hover, button.playlist-item[aria-current="true"] {
          background-color: #e1eefc;
          color: #12395e;
      }
      #unavailable { margin-top: 15px; text-align: left; }
      #unavailable ul { padding-left: 24px; }
      #synthetic-notice { color: #595959; font-size: .875rem; }
  </style>
</head>
<body>
    <main class="player-container">
        <a href="index.html">返回书架</a>
        <h1 id="bookTitle">听舒</h1>
        <p id="synthetic-notice" hidden>AI 合成朗读</p>
        <p class="now-playing" id="nowPlaying" role="status">正在加载音频…</p>
        <div id="player-controls" hidden>
            <audio id="audioPlayer" controls preload="metadata" aria-label="章节播放器">
                您的浏览器不支持 audio 元素。
            </audio>
            <div class="button-container">
                <button id="previous" type="button" disabled>上一章</button>
                <button id="next" type="button" disabled>下一章</button>
            </div>
        </div>
        <ol class="playlist" id="playlist" aria-label="可听章节" hidden></ol>
        <details id="unavailable" hidden>
            <summary>待补音频的章节</summary>
            <ul></ul>
        </details>
    </main>
    <script type="module" src="book.js"></script>
</body>
</html>
