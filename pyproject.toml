[project]
name = "tingshu"
version = "0.1.0"
description = "Tingshu TTS System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["TTS", "Speech", "Voice clone"]
license = {text = "CC BY-NC-SA 4.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "numpy>=2,<3",
    "transformers>=5.23,<6",
    "datasets>=5.2,<6",
    "lightning>=2.6.6,<3",
    "hydra-core>=1.3.8,<1.4",
    "tensorboard>=2.14.1",
    "natsort>=8.4.0",
    "einops>=0.7.0",
    "librosa>=0.10.1",
    "rich>=13.5.3",
    "gradio>=6.32,<7",
    "wandb>=0.15.11",
    "grpcio>=1.58.0",
    "kui>=1.6.0",
    "uvicorn>=0.30.0",
    "loguru>=0.6.0",
    "loralib>=0.1.2",
    "pyrootutils>=1.0.4",
    "vector-quantize-pytorch==1.14.24",
    "resampy>=0.4.3",
    "einx[torch]==0.2.2",
    "zstandard>=0.22.0",
    "pydub>=0.25.1",
    "faster_whisper>=0.1",
    "modelscope>=1.27,<2",
    "funasr==1.1.5",
    "opencc-python-reimplemented==0.1.7",
    "silero-vad>=0.4.1",
    "ormsgpack>=0.6.0",
    "soundfile>=0.13.1",
    "pillow>=13.0.0",
    "torch>=2.13,<2.16",
    "torchaudio>=2.11.1,<2.12",
]

[project.optional-dependencies]
stable = []

[build-system]
requires = ["setuptools>=42", "setuptools-scm>=6.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
